services:
  mysql:
    image: mysql:8.0
    container_name: acb_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_acb_2026
      MYSQL_DATABASE: festival_acb
      MYSQL_USER: acb_app
      MYSQL_PASSWORD: acb_local_2026
      TZ: America/La_Paz
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_acb_2026"]
      interval: 5s
      timeout: 5s
      retries: 12

  phpmyadmin:
    image: docker.io/library/phpmyadmin:latest
    container_name: acb_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_acb_2026
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - mysql